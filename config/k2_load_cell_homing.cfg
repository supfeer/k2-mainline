# The bottom stop sets only a coarse travel frame; PROBE establishes Z=0.
# Native sampling checks repeatability before refreshing the ADC reference.
[include k2_homing.cfg]

[force_move]
enable_force_move: True

[gcode_macro _K_ABORT_PREPARATION]
gcode:
  TURN_OFF_HEATERS
  SET_KINEMATIC_POSITION SET_HOMED=NONE CLEAR_HOMED=XYZ
  {% set acceleration = printer['gcode_macro K_HOME_SETTINGS'].homing_max_accel|float %}
  {% if acceleration > 0 %}
    SET_VELOCITY_LIMIT ACCEL={acceleration}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=K_HOME_SETTINGS VARIABLE=homing_max_accel VALUE=0
  _K_MESH_ACCEL_END
  K_INVALIDATE_MESH
  PRINT_PREPARE_CLEAR
  MOTOR_STALL_MODE DATA=2
  MOTOR_SYS_PARAM NUM=1 DATA=1 ID=70 PARAMS=100 PARAMS_TYPE=float
  BOX_ENABLE_HEART_PROCESS TNN=T1A

[gcode_macro _K_ABORT_IF_HOMING]
gcode:
  {% if 'gcode_macro K_HOME_SETTINGS' in printer and printer['gcode_macro K_HOME_SETTINGS'].homing_max_accel|float > 0 %}
    _K_ABORT_PREPARATION
  {% endif %}

[gcode_macro K_HOME_SETTINGS]
variable_bottom_reference: 350.84
variable_homing_max_accel: 0.0
variable_errors: {'ru': {'calibration': 'Датчик касания не откалиброван; хоуминг Z запрещён', 'motor': 'Дождитесь готовности моторных драйверов', 'geometry': 'Недопустимая геометрия безопасного хоуминга', 'contact': 'Касание не прошло проверку; координата Z не установлена'}, 'en': {'calibration': 'Load cell is not calibrated; Z homing is blocked', 'motor': 'Wait for the motor drivers to become ready', 'geometry': 'Invalid safe homing geometry', 'contact': 'Contact validation failed; Z position was not established'}}
gcode:
  M400

[gcode_macro _K_ENSURE_LOAD_CELL_CALIBRATED]
gcode:
  {% if not printer.load_cell_probe.is_calibrated %}
    K_LOAD_CELL_INIT
    CXSAVE_CONFIG
  {% endif %}

[homing_override]
axes: xyz
gcode:
  K_CHECK_MOTORS
  SET_GCODE_VARIABLE MACRO=K_HOME_SETTINGS VARIABLE=homing_max_accel VALUE={printer.toolhead.max_accel|float}
  {% set settings = printer['gcode_macro K_HOME_SETTINGS'] %}
  {% set language = printer.configfile.settings.k2_print.language|default('en') %}
  {% set errors = settings.errors.get(language, settings.errors.en) %}
  {% set all_axes = not ('X' in params or 'Y' in params or 'Z' in params) %}
  {% set home_z = all_axes or 'Z' in params %}
  {% set home_xy = all_axes or 'X' in params or 'Y' in params %}
  {% set need_xy = home_xy or 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
  {% set clean = params.C|default(1)|int(-1) %}
  {% set had_z = 'z' in printer.toolhead.homed_axes %}
  {% set absolute = printer.gcode_move.absolute_coordinates %}
  {% set z = printer.configfile.settings.stepper_z %}
  {% if not printer.motor_control.motor_ready %}
    {action_raise_error(errors.motor)}
  {% endif %}
  {% if not (350.0 <= settings.bottom_reference|float <= 352.0) or (home_z and (clean not in [0,1] or z.position_min|float != -1.0 or z.position_max|float != 350.0)) %}
    {action_raise_error(errors.geometry)}
  {% endif %}
  G90
  {% if home_z %}
    BED_MESH_CLEAR
    SET_GCODE_OFFSET Z=0 MOVE=0
  {% endif %}
  {% if had_z %}
    {% if need_xy or (home_z and (clean or not printer.load_cell_probe.is_calibrated)) %}
      K_Z_CLEARANCE
    {% endif %}
  {% else %}
    {% if 'gcode_macro K_MESH_STATE' in printer %}
      K_INVALIDATE_MESH
    {% endif %}
    K_ALIGN_PLATFORM
    SET_KINEMATIC_POSITION Z={settings.bottom_reference} SET_HOMED=Z
  {% endif %}
  {% if home_z %}
    _K_ENSURE_LOAD_CELL_CALIBRATED
  {% endif %}
  {% if need_xy %}
    K_HOME_XY
  {% endif %}
  {% if home_z %}
    {% if clean %}
      BOX_GO_TO_EXTRUDE_POS
      BOX_NOZZLE_CLEAN CIRCLE=1
    {% endif %}
    _K_HOME_Z_ONLY
  {% elif not had_z %}
    SET_KINEMATIC_POSITION SET_HOMED=NONE CLEAR_HOMED=Z
  {% endif %}
  {% if not absolute %}
    G91
  {% endif %}
  SET_GCODE_VARIABLE MACRO=K_HOME_SETTINGS VARIABLE=homing_max_accel VALUE=0

[gcode_macro K_PREPARE_PROBE]
gcode:
  {% set settings = printer['gcode_macro K_HOME_SETTINGS'] %}
  {% set language = printer.configfile.settings.k2_print.language|default('en') %}
  {% set errors = settings.errors.get(language, settings.errors.en) %}
  {% set z = printer.configfile.settings.stepper_z %}
  {% set mesh = printer.configfile.settings.bed_mesh %}
  {% set reference = mesh.zero_reference_position %}
  {% if not (mesh.mesh_min[0]|float <= reference[0]|float <= mesh.mesh_max[0]|float) or not (mesh.mesh_min[1]|float <= reference[1]|float <= mesh.mesh_max[1]|float) %}
    {action_raise_error(errors.geometry)}
  {% endif %}
  {% if not printer.motor_control.motor_ready %}
    {action_raise_error(errors.motor)}
  {% endif %}
  {% if not printer.load_cell_probe.is_calibrated %}
    {action_raise_error(errors.calibration)}
  {% endif %}
  {% if z.position_min|float != -1.0 or z.position_max|float != 350.0 or printer.configfile.settings.load_cell_probe.sample_retract_dist|float != 2.0 or not ('x' in printer.toolhead.homed_axes and 'y' in printer.toolhead.homed_axes and 'z' in printer.toolhead.homed_axes) %}
    {action_raise_error(errors.geometry)}
  {% endif %}
  {% if not (350.0 <= settings.bottom_reference|float <= 352.0) or not (0.0 <= printer.toolhead.position.z|float <= 352.0) %}
    {action_raise_error(errors.geometry)}
  {% endif %}
  G90
  G92 Z{printer.toolhead.position.z}
  {% if printer.toolhead.position.z|float < 10.0 %}
    K_PROBE_APPROACH Z=10
  {% endif %}
  G1 X{reference[0]|float + printer.gcode_move.gcode_position.x|float - printer.toolhead.position.x|float} Y{reference[1]|float + printer.gcode_move.gcode_position.y|float - printer.toolhead.position.y|float} F3000
  M400

[gcode_macro _K_HOME_Z_ONLY]
gcode:
  {% set retract = printer.configfile.settings.load_cell_probe.sample_retract_dist|float + 1.0 %}
  K_PREPARE_PROBE
  # The optical frame can put contact below zero; add clearance on every fine tap.
  K_PROBE_APPROACH Z=2.5
  # The shared probing move waits for a stable unloaded zero at each tap.
  # One fresh series absorbs a single outlier contact; a repeat still stops.
  PROBE SAMPLES=3 SAMPLES_RESULT=median SAMPLES_TOLERANCE=0.05 SAMPLES_TOLERANCE_RETRIES=1 SAMPLE_RETRACT_DIST={retract}
  SET_KINEMATIC_POSITION SET_HOMED=NONE CLEAR_HOMED=Z
  _K_ACCEPT_Z_HOME RETRACT={retract}
  K_Z_CLEARANCE

[gcode_macro _K_ACCEPT_Z_HOME]
gcode:
  {% set settings = printer['gcode_macro K_HOME_SETTINGS'] %}
  {% set language = printer.configfile.settings.k2_print.language|default('en') %}
  {% set errors = settings.errors.get(language, settings.errors.en) %}
  {% set touch = printer.load_cell_probe.last_probe_position[2]|float %}
  {% set offset = printer.configfile.settings.load_cell_probe.z_offset|float %}
  {% set retract = params.RETRACT|float %}
  {% set position = printer.toolhead.position.z|float - touch + offset %}
  {% if not printer.load_cell_probe.is_last_tap_valid or not (-1.0 <= touch <= 2.0) or not (retract - 1.0 <= position <= retract + 1.0) %}
    {action_raise_error(errors.contact)}
  {% endif %}
  SET_KINEMATIC_POSITION Z={position} SET_HOMED=Z
  G92 Z{position}
