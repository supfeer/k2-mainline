# The verified GD32F303xE MAIN uses the vendor's nominal sensor curve.
# Keep upstream temperature_mcu.py unchanged; use its standard ADC converter.
[adc_temperature k2_gd32f303xe]
temperature1: 25
voltage1: 1.45
temperature2: 125
voltage2: 1.04

[temperature_sensor mcu_temp]
sensor_type: k2_gd32f303xe
sensor_pin: ADC_TEMPERATURE
adc_voltage: 3.3
min_temp: -30
max_temp: 100
