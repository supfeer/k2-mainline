[include k2_cfs_tools.cfg]

[k2]
load_cell_auto_reference: True

[k2_print]
language: ru
on_error_gcode:
  _K_ABORT_IF_HOMING
  _K_MESH_ACCEL_END

[k2_display]

[virtual_sdcard]
on_error_gcode:
  _K_ABORT_PREPARATION

[gcode_macro M141]
variable_errors: {'ru': 'Некорректная температура камеры: укажите S от 0 до предела нагревателя', 'en': 'Invalid chamber temperature: specify S from zero to the heater limit'}
gcode:
  {% if 'S' in params %}
    {% set raw = params.S|trim %}
    {% set target = 0.0 if raw == '' else raw|float(none) %}
    {% set maximum = printer.configfile.settings['heater_generic chamber_heater'].max_temp|float %}
    {% set language = printer.configfile.settings.k2_print.language|default('en') %}
    {% set errors = printer['gcode_macro M141'].errors %}
    {% if target is none or not (0 <= target < maximum) %}
      {action_raise_error(errors.get(language, errors.en))}
    {% endif %}
    # Keep the stock K2 policy: low targets use ventilation, high targets use heat.
    {% if target > 40 %}
      {% if printer['gcode_macro Qmode'].flag | int == 1 %}
        SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=chamber_fan_target VALUE=0.0
        SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=fan1_value VALUE=0.0
        SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=fan1_was_throttled VALUE=0
      {% endif %}
      SET_PIN PIN=fan1 VALUE=0
      SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_fan TARGET=0
      SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={target}
    {% else %}
      {% set cool_target = target if target > 0 else 35 %}
      {% if printer['gcode_macro Qmode'].flag | int == 1 %}
        SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=chamber_fan_target VALUE={cool_target}
        SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=fan1_value VALUE=0.0
        SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=fan1_was_throttled VALUE=0
      {% endif %}
      SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET=0
      SET_PIN PIN=fan1 VALUE=0
      SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_fan TARGET={cool_target}
    {% endif %}
  {% endif %}

[gcode_macro M191]
gcode:
  {% set raw = params.S|default('')|trim %}
  {% set target = 0.0 if raw == '' else raw|float(none) %}
  M141 S{raw if raw != '' else 0}
  {% if target is not none and target > 40 %}
    {% set delta = printer.configfile.settings['heater_generic chamber_heater'].max_delta|float %}
    TEMPERATURE_WAIT SENSOR="heater_generic chamber_heater" MINIMUM={target - delta}
  {% endif %}

[gcode_macro START_PRINT]
variable_prepare: 0
variable_soak_seconds: 300
variable_soak_z: 15.0
variable_errors: {'ru': {'parameters': 'Некорректные параметры подготовки печати', 'calibration': 'Датчик касания не откалиброван; выполните K_LOAD_CELL_INIT и SAVE_CONFIG перед запуском печати', 'mesh': 'Нет актуальной сетки для этой температуры; разрешите измерение CALIBRATE=1', 'resume': 'Нельзя безопасно возобновить: проверьте хоуминг, моторы и свободный ход Z', 'paused': 'Принтер не находится на паузе', 'park': 'Точка парковки должна находиться внутри области измерения сетки', 'prime': 'Стартовая полоса доступна только после подготовки печати с прогретым соплом'}, 'en': {'parameters': 'Invalid print preparation parameters', 'calibration': 'Load cell is not calibrated; run K_LOAD_CELL_INIT and SAVE_CONFIG before starting print', 'mesh': 'No current mesh for this temperature; permit measurement with CALIBRATE=1', 'resume': 'Cannot resume safely: check homing, motors and available Z clearance', 'paused': 'The printer is not paused', 'park': 'The parking point must be inside the configured mesh area', 'prime': 'The prime line needs a prepared print and a heated nozzle'}}
gcode:
  {% set bed = params.BED_TEMP|default(60)|float %}
  {% set nozzle = params.EXTRUDER_TEMP|default(220)|float %}
  {% set chamber = params.CHAMBER_TEMP|default(printer['heater_generic chamber_heater'].target)|float(none) %}
  {% set soak = params.SOAK|default(printer['gcode_macro START_PRINT'].soak_seconds)|float %}
  {% set soak_z = printer['gcode_macro START_PRINT'].soak_z|float(none) %}
  {% set calibrate = params.CALIBRATE|default(-1)|int %}
  {% set adaptive = params.ADAPTIVE|default(0)|int %}
  # Optical alignment sets the Z gantry frame; use Z_TILT=1 only on demand.
  {% set tilt = params.Z_TILT|default(0)|int %}
  {% set language = printer.configfile.settings.k2_print.language|default('en') %}
  {% set errors = printer['gcode_macro START_PRINT'].errors %}
  {% if chamber is none or soak_z is none or not (10 <= soak_z <= 20) or not (0 <= bed < printer.configfile.settings.heater_bed.max_temp|float) or not (140 <= nozzle < printer.configfile.settings.extruder.max_temp|float) or not (0 <= chamber < printer.configfile.settings['heater_generic chamber_heater'].max_temp|float) or not (0 <= soak <= 3600) or calibrate not in [-1,0,1] or tilt not in [-1,0,1] or adaptive not in [0,1] or params.ALGORITHM|default('bicubic')|lower not in ['bicubic', 'lagrange'] %}
    {action_raise_error(errors.get(language, errors.en).parameters)}
  {% endif %}
  K_PRINT_PARAMETERS BED_TEMP={bed} EXTRUDER_TEMP={nozzle}
  SET_GCODE_VARIABLE MACRO=_K_HOT_CLEAN VARIABLE=temperature VALUE={[nozzle, 180.0]|max}
  BOX_START_PRINT
  M220 S100
  SET_PIN PIN=extruder_fan VALUE=1
  UPDATE_DELAYED_GCODE ID=_K_END_COOLING DURATION=0
  PRINT_PREPARE_CLEAR
  BED_MESH_CLEAR
  SET_GCODE_OFFSET Z=0 MOVE=0
  G90
  M82
  # Establish only the axes needed to reach the brush; no probe contact here.
  {% set had_z = 'z' in printer.toolhead.homed_axes %}
  G28 X Y
  {% if not had_z %}
    # XY homing leaves the platform at the optical bottom reference.
    SET_KINEMATIC_POSITION Z={printer['gcode_macro K_HOME_SETTINGS'].bottom_reference|float} SET_HOMED=Z
  {% elif not printer.load_cell_probe.is_calibrated %}
    K_Z_CLEARANCE
  {% endif %}
  _K_ENSURE_LOAD_CELL_CALIBRATED
  _K_HOT_CLEAN
  _K_CENTER_HEAD
  M140 S{bed}
  M104 S140
  {% if params.CHAMBER_TEMP is defined %}
    M141 S{chamber}
  {% endif %}
  # Soak with the platform close to the nozzle so both reach temperature together.
  K_PROBE_APPROACH Z={soak_z}
  {% if bed > 0 %}
    M190 S{bed}
  {% endif %}
  M109 S140
  # Measure the mesh only after the chamber has reached its operating range.
  {% if chamber > 40 %}
    M191 S{chamber}
  {% endif %}
  {% if soak > 0 %}
    G4 P{(soak * 1000)|int}
  {% endif %}
  _K_HOT_CLEAN
  G28 Z C0
  _K_PREPARE_PRINT {rawparams} BED_TEMP={bed} EXTRUDER_TEMP={nozzle} CALIBRATE={calibrate} ADAPTIVE={adaptive} Z_TILT={tilt} PREPARE_ONLY={params.PREPARE_ONLY|default(0)|int}

[gcode_macro _K_CENTER_HEAD]
gcode:
  {% set mesh = printer.configfile.settings.bed_mesh %}
  {% set reference = mesh.zero_reference_position %}
  {% if not (mesh.mesh_min[0]|float <= reference[0]|float <= mesh.mesh_max[0]|float) or not (mesh.mesh_min[1]|float <= reference[1]|float <= mesh.mesh_max[1]|float) %}
    {% set language = printer.configfile.settings.k2_print.language|default('en') %}
    {% set errors = printer['gcode_macro START_PRINT'].errors %}
    {action_raise_error(errors.get(language, errors.en).parameters)}
  {% endif %}
  G90
  G1 X{reference[0]|float + printer.gcode_move.gcode_position.x|float - printer.toolhead.position.x|float} Y{reference[1]|float + printer.gcode_move.gcode_position.y|float - printer.toolhead.position.y|float} F12000

# Clean at the selected material temperature, then wipe through cooldown.
# The standalone default is retained until START_PRINT supplies a material.
[gcode_macro _K_HOT_CLEAN]
variable_temperature: 180.0
variable_cool_steps: [165.0, 150.0]
variable_finish_temperature: 140.0
variable_retract: 1.0
gcode:
  {% set clean = printer['gcode_macro _K_HOT_CLEAN'] %}
  BOX_GO_TO_EXTRUDE_POS
  M109 S{clean.temperature|float}
  BOX_NOZZLE_CLEAN
  {% if clean.retract|float > 0 %}
    SAVE_GCODE_STATE NAME=K_HOT_CLEAN
    M83
    G1 E-{clean.retract|float} F1800
    RESTORE_GCODE_STATE NAME=K_HOT_CLEAN MOVE=0
  {% endif %}
  M104 S{clean.finish_temperature|float}
  M106 P0 S255
  M106 P2 S255
  {% for step in clean.cool_steps %}
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={step|float}
    BOX_NOZZLE_CLEAN
  {% endfor %}
  TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={clean.finish_temperature|float + 2.0}
  M107 P0
  M107 P2
  M109 S{clean.finish_temperature|float}
  BOX_NOZZLE_CLEAN
  RESTORE_LIMITS

[gcode_macro _K_PROBE_CLEAN_RETRY]
gcode:
  {% set position = printer.gcode_move.gcode_position %}
  SAVE_GCODE_STATE NAME=K_PROBE_CLEAN_RETRY
  K_Z_CLEARANCE
  _K_HOT_CLEAN
  G90
  G1 X{position.x} Y{position.y} F3000
  M400
  G1 Z{position.z} F480
  M400
  RESTORE_GCODE_STATE NAME=K_PROBE_CLEAN_RETRY MOVE=0

[k2_cancel]

[k2_mesh]
outlier_tolerance: 0.3
recheck_offset: 5

[gcode_macro K_MESH_STATE]
variable_valid: 0
variable_bed_temperature: 0.0
variable_max_age_seconds: 1800
variable_temperature_tolerance: 1.0
variable_probe_accel: 2000.0
variable_restore_accel: 0.0
gcode:
  M400

[gcode_macro K_INVALIDATE_MESH]
gcode:
  SET_GCODE_VARIABLE MACRO=K_MESH_STATE VARIABLE=valid VALUE=0
  UPDATE_DELAYED_GCODE ID=_K_MESH_EXPIRE DURATION=0

[delayed_gcode _K_MESH_EXPIRE]
gcode:
  SET_GCODE_VARIABLE MACRO=K_MESH_STATE VARIABLE=valid VALUE=0

[gcode_macro Z_TILT_ADJUST]
rename_existing: _K_Z_TILT_NATIVE
gcode:
  K_INVALIDATE_MESH
  BED_MESH_CLEAR
  _K_MESH_ACCEL_BEGIN
  _K_Z_TILT_NATIVE {rawparams}
  _K_MESH_ACCEL_END

[gcode_macro SCREWS_TILT_CALCULATE]
rename_existing: _K_SCREWS_TILT_NATIVE
gcode:
  BED_MESH_CLEAR
  _K_MESH_ACCEL_BEGIN
  _K_SCREWS_TILT_NATIVE {rawparams}
  _K_MESH_ACCEL_END

[gcode_macro _K_PREPARE_PRINT]
gcode:
  {% set state = printer['gcode_macro K_MESH_STATE'] %}
  {% set valid = state.valid|int and (state.bed_temperature|float - params.BED_TEMP|float)|abs <= state.temperature_tolerance|float %}
  {% set tilt = params.Z_TILT|int %}
  {% if tilt == 1 or (tilt == -1 and not valid) %}
    Z_TILT_ADJUST
    G28 Z C0
  {% endif %}
  _K_PREPARE_MESH {rawparams}

[gcode_macro _K_PREPARE_MESH]
gcode:
  {% set language = printer.configfile.settings.k2_print.language|default('en') %}
  {% set errors = printer['gcode_macro START_PRINT'].errors %}
  {% set mesh = printer.configfile.settings.bed_mesh %}
  {% set adaptive = params.ADAPTIVE|int %}
  # A slicer-provided area (Orca adaptive_bed_mesh_min/max) is a partial mesh like ADAPTIVE.
  {% set area = 'MESH_MIN' in params or 'MESH_MAX' in params %}
  {% set low = params.MESH_MIN|default(mesh.mesh_min|join(',')) %}
  {% set high = params.MESH_MAX|default(mesh.mesh_max|join(',')) %}
  {% set low = low.split(',') %}
  {% set high = high.split(',') %}
  {% if area and (low|length != 2 or high|length != 2) %}
    {action_raise_error(errors.get(language, errors.en).parameters)}
  {% endif %}
  {% set x0 = [[low[0]|float, mesh.mesh_min[0]|float]|max, mesh.mesh_max[0]|float]|min %}
  {% set y0 = [[low[1]|float, mesh.mesh_min[1]|float]|max, mesh.mesh_max[1]|float]|min %}
  {% set x1 = [[high[0]|float, mesh.mesh_min[0]|float]|max, mesh.mesh_max[0]|float]|min %}
  {% set y1 = [[high[1]|float, mesh.mesh_min[1]|float]|max, mesh.mesh_max[1]|float]|min %}
  {% if area and not (x1 > x0 and y1 > y0) %}
    {action_raise_error(errors.get(language, errors.en).parameters)}
  {% endif %}
  {% set mesh_profile = 'k2_adaptive' if (adaptive or area) else 'k2_load_cell' %}
  K_MESH_CHECK {rawparams} PROFILE={mesh_profile} ADAPTIVE={adaptive} MESH_MIN={x0},{y0} MESH_MAX={x1},{y1} PROBE_COUNT={params.PROBE_COUNT|default(mesh.probe_count|join(','))} ALGORITHM={params.ALGORITHM|default(mesh.algorithm)|lower} ADAPTIVE_MARGIN={params.ADAPTIVE_MARGIN|default(mesh.adaptive_margin)|float}
  _K_PREPARE_MESH_CHECKED {rawparams}{% if area %} MESH_MIN={x0},{y0} MESH_MAX={x1},{y1}{% endif %}

[gcode_macro _K_PREPARE_MESH_CHECKED]
gcode:
  {% set state = printer['gcode_macro K_MESH_STATE'] %}
  {% set language = printer.configfile.settings.k2_print.language|default('en') %}
  {% set errors = printer['gcode_macro START_PRINT'].errors %}
  {% set calibrate = params.CALIBRATE|int %}
  {% set adaptive = params.ADAPTIVE|int %}
  {% set area = 'MESH_MIN' in params or 'MESH_MAX' in params %}
  {% set partial = adaptive or area %}
  {% set mesh_profile = 'k2_adaptive' if partial else 'k2_load_cell' %}
  {% set valid = state.valid|int and (state.bed_temperature|float - params.BED_TEMP|float)|abs <= state.temperature_tolerance|float and mesh_profile in printer.bed_mesh.profiles and printer.k2_mesh.matches %}
  {% set save_mesh = 1 if ((calibrate == 1 or not valid) and not partial) else 0 %}
  {% if calibrate == 0 and not valid %}
    {action_raise_error(errors.get(language, errors.en).mesh)}
  {% endif %}
  {% if calibrate == 1 or not valid %}
    K_INVALIDATE_MESH
    _K_MESH_ACCEL_BEGIN
    BED_MESH_CALIBRATE PROFILE={mesh_profile} ADAPTIVE={adaptive}{% if area %} MESH_MIN={params.MESH_MIN} MESH_MAX={params.MESH_MAX}{% endif %}{% if 'ALGORITHM' in params %} ALGORITHM={params.ALGORITHM|lower}{% endif %}{% if 'PROBE_COUNT' in params %} PROBE_COUNT={params.PROBE_COUNT}{% endif %}{% if 'ADAPTIVE_MARGIN' in params %} ADAPTIVE_MARGIN={params.ADAPTIVE_MARGIN|float}{% endif %}
    _K_MESH_ACCEL_END
    {% if partial %}
      K_MESH_DISCARD_PENDING PROFILE={mesh_profile}
    {% else %}
      BED_MESH_PROFILE SAVE=default
    {% endif %}
    BED_MESH_CLEAR
    G28 Z C0
    BED_MESH_PROFILE LOAD={mesh_profile}
    _K_REMEMBER_MESH BED_TEMP={params.BED_TEMP} ADAPTIVE={partial|int}
  {% else %}
    BED_MESH_PROFILE LOAD={mesh_profile}
  {% endif %}
  _K_START_READY EXTRUDER_TEMP={params.EXTRUDER_TEMP} PREPARE_ONLY={params.PREPARE_ONLY} SAVE_MESH={save_mesh}

# A full-acceleration stop between mesh points makes the load cell ring
# past the trigger force before the next tare.
[gcode_macro _K_MESH_ACCEL_BEGIN]
gcode:
  {% set state = printer['gcode_macro K_MESH_STATE'] %}
  {% set acceleration = printer.toolhead.max_accel|float %}
  {% if state.restore_accel|float <= 0 %}
    SET_GCODE_VARIABLE MACRO=K_MESH_STATE VARIABLE=restore_accel VALUE={acceleration}
  {% endif %}
  SET_VELOCITY_LIMIT ACCEL={[state.probe_accel|float, acceleration]|min}

[gcode_macro _K_MESH_ACCEL_END]
gcode:
  {% set acceleration = printer['gcode_macro K_MESH_STATE'].restore_accel|float %}
  {% if acceleration > 0 %}
    SET_VELOCITY_LIMIT ACCEL={acceleration}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=K_MESH_STATE VARIABLE=restore_accel VALUE=0

[gcode_macro _K_REMEMBER_MESH]
gcode:
  {% set age = printer['gcode_macro K_MESH_STATE'].max_age_seconds|int %}
  {% if age > 0 %}
    K_MESH_COMMIT
    SET_GCODE_VARIABLE MACRO=K_MESH_STATE VARIABLE=bed_temperature VALUE={params.BED_TEMP|float}
    SET_GCODE_VARIABLE MACRO=K_MESH_STATE VARIABLE=valid VALUE=1
    UPDATE_DELAYED_GCODE ID=_K_MESH_EXPIRE DURATION={age}
  {% endif %}

[gcode_macro _K_START_READY]
gcode:
  {% if params.PREPARE_ONLY|int %}
    TURN_OFF_HEATERS
    M141 S0
    PRINT_PREPARE_CLEAR
    {% if params.SAVE_MESH|default(0)|int and printer.configfile.save_config_pending %}
      CXSAVE_CONFIG
    {% endif %}
  {% else %}
    # Heat to the print temperature over the waste chute, not over the bed.
    BOX_GO_TO_EXTRUDE_POS
    SET_PIN PIN=extruder_fan VALUE=1
    {% if printer['heater_generic chamber_heater'].target|float > 40 %}
      M191 S{printer['heater_generic chamber_heater'].target|float}
    {% endif %}
    M109 S{params.EXTRUDER_TEMP|float}
    RESTORE_LIMITS
    G92 E0
    PRINT_PREPARED
  {% endif %}

[save_variables]
filename: ~/printer_data/config/k2_variables.cfg

# Purge into the chute, wipe, and lay a line at the rear edge near the chute.
# Each print moves to the next free row so an unremoved line is not overlapped.
[gcode_macro K_PRIME_LINE]
variable_purge: 20.0
variable_purge_speed: 300
variable_rows: [342.0, 338.0, 334.0, 330.0, 326.0, 322.0]
variable_x_start: 150.0
variable_x_end: 40.0
variable_wipe: 10.0
variable_height: 0.3
variable_width: 0.6
variable_speed: 1800
variable_travel_speed: 30000
variable_margin: 3.0
gcode:
  {% set line = printer['gcode_macro K_PRIME_LINE'] %}
  {% set language = printer.configfile.settings.k2_print.language|default('en') %}
  {% set errors = printer['gcode_macro START_PRINT'].errors %}
  {% if not printer['gcode_macro START_PRINT'].prepare|int or not ('x' in printer.toolhead.homed_axes and 'y' in printer.toolhead.homed_axes and 'z' in printer.toolhead.homed_axes) or printer.extruder.target|float < 140 %}
    {action_raise_error(errors.get(language, errors.en).prime)}
  {% endif %}
  {% set rows = line.rows %}
  {% set last = printer.save_variables.variables.k2_prime_row|default(-1)|int %}
  {% set ns = namespace(row=-1) %}
  {% for step in range(1, rows|length + 1) %}
    {% set index = (last + step) % rows|length %}
    {% set y = rows[index]|float %}
    {% set busy = namespace(value=false) %}
    {% for item in printer.exclude_object.objects if item.polygon is defined %}
      {% set xs = item.polygon|map(attribute=0)|list %}
      {% set ys = item.polygon|map(attribute=1)|list %}
      {% if xs|min - line.margin|float <= line.x_start|float and xs|max + line.margin|float >= line.x_end|float - line.wipe|float and ys|min - line.margin|float <= y and ys|max + line.margin|float >= y %}
        {% set busy.value = true %}
      {% endif %}
    {% endfor %}
    {% if ns.row < 0 and not busy.value %}
      {% set ns.row = index %}
    {% endif %}
  {% endfor %}
  {% set area = 3.14159265 * (printer.configfile.settings.extruder.filament_diameter|float / 2.0) ** 2 %}
  {% set length = line.x_start|float - line.x_end|float %}
  SAVE_GCODE_STATE NAME=K_PRIME_LINE
  G90
  M83
  BOX_GO_TO_EXTRUDE_POS
  M109 S{printer.extruder.target|float}
  G1 E{line.purge|float} F{line.purge_speed|float}
  G1 E-0.5 F2400
  BOX_NOZZLE_CLEAN
  RESTORE_LIMITS
  {% if ns.row >= 0 %}
    {% set y = rows[ns.row]|float %}
    G1 X{line.x_start|float} Y{y} F{line.travel_speed|float}
    G1 Z{line.height|float} F1200
    G1 E0.5 F2400
    G1 X{line.x_end|float} Y{y} E{(line.width|float * line.height|float * length / area)|round(4)} F{line.speed|float}
    G1 X{line.x_end|float - line.wipe|float} Y{y} F{line.speed|float}
    G1 Z{line.height|float + 1.0} F1200
    SAVE_VARIABLE VARIABLE=k2_prime_row VALUE={ns.row}
  {% else %}
    {action_respond_info("K_PRIME_LINE: no free row, purge only")}
  {% endif %}
  G92 E0
  RESTORE_GCODE_STATE NAME=K_PRIME_LINE MOVE=0

[gcode_macro PRINT_PREPARED]
gcode:
  SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=prepare VALUE=1

[gcode_macro PRINT_PREPARE_CLEAR]
gcode:
  SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=prepare VALUE=0

[gcode_macro G29]
gcode:
  {% set args = namespace(items=[]) %}
  {% for key, val in params.items() %}
    {% set k = key|upper %}
    {% if k not in ['G', 'CALIBRATE', 'PREPARE_ONLY'] %}
      {% set v = val|string|trim %}
      {% if v.startswith('=') %}
        {% set v = v[1:]|trim %}
      {% endif %}
      {% if v != '' %}
        {% set _ = args.items.append(k ~ '=' ~ v) %}
      {% endif %}
    {% endif %}
  {% endfor %}
  {% if 'SOAK' not in params %}
    {% set _ = args.items.append('SOAK=0') %}
  {% endif %}
  START_PRINT {args.items|join(' ')} CALIBRATE=1 PREPARE_ONLY=1

[gcode_macro BED_MESH_CALIBRATE_START_PRINT]
gcode:
  START_PRINT {rawparams} PREPARE_ONLY=1

[gcode_macro END_PRINT_Z_SAFE]
gcode:
  {% if 'z' in printer.toolhead.homed_axes %}
    K_Z_CLEARANCE
  {% endif %}

[gcode_macro END_PRINT]
gcode:
  TURN_OFF_HEATERS
  M400
  _K_END_RETRACT
  SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
  M141 S0
  M220 S100
  SET_PIN PIN=extruder_fan VALUE=0
  _K_END_PARK

[gcode_macro _K_END_RETRACT]
variable_length: 2.0
variable_speed: 2400
gcode:
  {% set retract = printer['gcode_macro _K_END_RETRACT'] %}
  {% if printer.extruder.can_extrude %}
    SAVE_GCODE_STATE NAME=K_END_RETRACT
    M83
    G1 E-{retract.length|float} F{retract.speed|float}
    RESTORE_GCODE_STATE NAME=K_END_RETRACT MOVE=0
  {% endif %}

# The still-hot nozzle is wiped over the waste chute and parked there; the
# part and chamber fans run at full speed until the nozzle reaches 140 C.
[gcode_macro _K_END_PARK]
variable_lift: 10.0
variable_lift_speed: 1200
variable_fan_off_temp: 140.0
gcode:
  {% set park = printer['gcode_macro _K_END_PARK'] %}
  {% set position = printer.toolhead.position.z|float %}
  {% set minimum = printer.toolhead.axis_minimum.z|float %}
  {% set maximum = printer.toolhead.axis_maximum.z|float %}
  {% if 'x' in printer.toolhead.homed_axes and 'y' in printer.toolhead.homed_axes and 'z' in printer.toolhead.homed_axes and minimum <= position <= maximum - 1.0 and park.lift|float >= 1.0 %}
    {% set distance = [park.lift|float, maximum - position]|min %}
    SAVE_GCODE_STATE NAME=K_END_PARK
    G91
    {% if distance > 0.0 %}
      G1 Z{distance} F{park.lift_speed|float}
    {% endif %}
    RESTORE_GCODE_STATE NAME=K_END_PARK MOVE=0
    M106 P0 S255
    M106 P2 S255
    UPDATE_DELAYED_GCODE ID=_K_END_COOLING DURATION=2
    BOX_GO_TO_EXTRUDE_POS
    BOX_NOZZLE_CLEAN
    M400
    RESTORE_LIMITS
  {% else %}
    M107 P0
    M107 P2
  {% endif %}

[delayed_gcode _K_END_COOLING]
gcode:
  {% if printer.extruder.temperature|float <= printer['gcode_macro _K_END_PARK'].fan_off_temp|float or printer.extruder.target|float > 0 %}
    M107 P0
    M107 P2
  {% else %}
    UPDATE_DELAYED_GCODE ID=_K_END_COOLING DURATION=2
  {% endif %}

[gcode_macro CANCEL_PRINT]
rename_existing: CANCEL_PRINT_BASE
gcode:
  CANCEL_PRINT_BASE
  K_INVALIDATE_MESH
  END_PRINT

[gcode_macro MOTOR_CANCEL_PRINT]
gcode:
  CANCEL_PRINT

[gcode_macro PAUSE]
rename_existing: PAUSE_BASE
variable_extrude: 2.0
variable_park_x: 5.0
variable_park_y: 345.0
variable_x: 0.0
variable_y: 0.0
variable_z: 0.0
variable_target: 0.0
gcode:
  {% if not printer.pause_resume.is_paused %}
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=x VALUE={printer.gcode_move.gcode_position.x}
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=y VALUE={printer.gcode_move.gcode_position.y}
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=z VALUE={printer.toolhead.position.z}
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=target VALUE={printer.extruder.target}
    PAUSE_BASE
    BOX_SAVE_FAN
    _K_PAUSE_PARK
  {% endif %}

[gcode_macro _K_PAUSE_PARK]
gcode:
  SAVE_GCODE_STATE NAME=K_PAUSE_PARK
  {% if 'z' in printer.toolhead.homed_axes %}
    K_Z_CLEARANCE
    _K_PAUSE_XY
  {% endif %}
  {% if printer.extruder.can_extrude %}
    M83
    G1 E-{printer['gcode_macro PAUSE'].extrude|float} F1800
  {% endif %}
  RESTORE_GCODE_STATE NAME=K_PAUSE_PARK MOVE=0

[gcode_macro _K_PAUSE_XY]
gcode:
  {% set pause = printer['gcode_macro PAUSE'] %}
  {% set language = printer.configfile.settings.k2_print.language|default('en') %}
  {% set errors = printer['gcode_macro START_PRINT'].errors %}
  {% set mesh = printer.configfile.settings.bed_mesh %}
  {% if not (mesh.mesh_min[0]|float <= pause.park_x|float <= mesh.mesh_max[0]|float) or not (mesh.mesh_min[1]|float <= pause.park_y|float <= mesh.mesh_max[1]|float) %}
    {action_raise_error(errors.get(language, errors.en).park)}
  {% endif %}
  {% if 'x' in printer.toolhead.homed_axes and 'y' in printer.toolhead.homed_axes and printer.toolhead.position.z|float - pause.z|float >= 1.0 %}
    G90
    # Leave the service area along Y before crossing the bed along X.
    G1 Y{pause.park_y|float + printer.gcode_move.gcode_position.y|float - printer.toolhead.position.y|float} F3000
    G1 X{pause.park_x|float + printer.gcode_move.gcode_position.x|float - printer.toolhead.position.x|float} F3000
    M400
  {% endif %}

[gcode_macro RESUME]
rename_existing: RESUME_BASE
gcode:
  {% if printer.pause_resume.is_paused %}
    _K_RESUME_CLEARANCE
    SET_PIN PIN=extruder_fan VALUE=1
    BOX_ERROR_RESUME_PROCESS
    _K_RESUME_AFTER_CFS {rawparams}
  {% else %}
    RESUME_BASE {rawparams}
  {% endif %}

[gcode_macro _K_RESUME_CLEARANCE]
gcode:
  {% set pause = printer['gcode_macro PAUSE'] %}
  {% set language = printer.configfile.settings.k2_print.language|default('en') %}
  {% set errors = printer['gcode_macro START_PRINT'].errors %}
  {% set minimum = printer.toolhead.axis_minimum.z|float %}
  {% set maximum = printer.toolhead.axis_maximum.z|float %}
  {% set current = printer.toolhead.position.z|float %}
  {% set target = [pause.z|float + 10, maximum]|min %}
  {% if not printer.pause_resume.is_paused or not printer.motor_control.motor_ready or not ('x' in printer.toolhead.homed_axes and 'y' in printer.toolhead.homed_axes and 'z' in printer.toolhead.homed_axes) or not (minimum <= current <= maximum) or not (target - pause.z|float >= 1.0) %}
    {action_raise_error(errors.get(language, errors.en).resume)}
  {% endif %}
  SAVE_GCODE_STATE NAME=K_RESUME_LIFT
  G91
  {% if target > current %}
    G1 Z{target - current} F120
  {% endif %}
  M400
  RESTORE_GCODE_STATE NAME=K_RESUME_LIFT MOVE=0

[gcode_macro _K_RESUME_AFTER_CFS]
gcode:
  {% set language = printer.configfile.settings.k2_print.language|default('en') %}
  {% set errors = printer['gcode_macro START_PRINT'].errors %}
  {% if not printer.k2_print.resume_err and not printer.motor_control.motor_ready %}
    {action_raise_error(errors.get(language, errors.en).resume)}
  {% endif %}
  {% if printer.k2_print.resume_err %}
    RESUME_BASE {rawparams}
  {% else %}
    {% if printer['gcode_macro PAUSE'].target|float > 0 %}
      M109 S{printer['gcode_macro PAUSE'].target|float}
    {% endif %}
    _K_RESUME_PRIME
    RESTORE_GCODE_STATE NAME=PAUSE_STATE MOVE=0
    _K_RESUME_RETURN_XY
    RESUME_BASE {rawparams}
    BOX_RESTORE_FAN
  {% endif %}

[gcode_macro _K_RESUME_PRIME]
gcode:
  {% if printer.extruder.can_extrude %}
    SAVE_GCODE_STATE NAME=K_RESUME_PRIME
    M83
    G1 E{printer['gcode_macro PAUSE'].extrude|float} F1800
    RESTORE_GCODE_STATE NAME=K_RESUME_PRIME MOVE=0
  {% endif %}

[gcode_macro _K_RESUME_RETURN_XY]
gcode:
  {% set pause = printer['gcode_macro PAUSE'] %}
  {% set language = printer.configfile.settings.k2_print.language|default('en') %}
  {% set errors = printer['gcode_macro START_PRINT'].errors %}
  {% set mesh = printer.configfile.settings.bed_mesh %}
  {% if not (mesh.mesh_min[1]|float <= pause.park_y|float <= mesh.mesh_max[1]|float) %}
    {action_raise_error(errors.get(language, errors.en).park)}
  {% endif %}
  _K_RESUME_CLEARANCE
  G90
  # CFS recovery can finish in the service area; cross X only after leaving it.
  G1 Y{pause.park_y|float + printer.gcode_move.gcode_position.y|float - printer.toolhead.position.y|float} F3000
  G1 X{pause.x} F3000
  G1 Y{pause.y} F3000
  M400

[gcode_macro NOZZLE_CLEAR]
gcode:
  K_Z_CLEARANCE
  BOX_GO_TO_EXTRUDE_POS
  BOX_NOZZLE_CLEAN CIRCLE=1
