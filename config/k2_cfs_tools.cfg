[gcode_macro T1]
variable_errors: {'ru': 'Укажите один слот CFS без дополнительных параметров: T1A-T4D', 'en': 'Select one CFS slot without extra parameters: T1A-T4D'}
gcode:
  {% set selection = dict(params) %}
  {% set _ = selection.pop('T', None) %}
  {% if not selection %}
    BOX_SELECT TOOL=1
  {% elif selection|length == 1 and selection.keys()|list|first in ['A', 'B', 'C', 'D'] and selection.values()|list|first == '' %}
    BOX_SELECT SLOT=T1{selection.keys()|list|first}
  {% else %}
    {% set language = printer.configfile.settings.k2_print.language|default('en') %}
    {action_raise_error(printer['gcode_macro T1'].errors.get(language, printer['gcode_macro T1'].errors.en))}
  {% endif %}

