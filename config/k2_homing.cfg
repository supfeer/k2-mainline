# Keep alignment policy in configuration, not in the sensor driver.
[stepper_x]
homing_speed: 100
homing_retract_dist: 0

[stepper_y]
homing_speed: 100
homing_retract_dist: 0

[gcode_macro K_CHECK_MOTORS]
gcode:
  K_QUERY_MOTORS
  _K_ASSERT_MOTORS

[gcode_macro _K_ASSERT_MOTORS]
variable_messages: {'ru': 'Драйвер мотора %s сообщает ошибку; хоуминг запрещён', 'en': 'Motor driver %s reports a fault; homing is blocked'}
variable_unverified_messages: {'ru': 'Нет подтверждённого ответа всех моторных драйверов; движение запрещено', 'en': 'Not all motor drivers returned verified status; movement is blocked'}
gcode:
  {% set language = printer.configfile.settings.k2_print.language|default('en') %}
  {% if not printer.motor_control.protection_verified %}
    {action_raise_error(unverified_messages.get(language, unverified_messages.en))}
  {% endif %}
  {% for name, codes in printer.motor_control.errors.items() %}
    {% if codes %}
      {action_raise_error(messages.get(language, messages.en) % name)}
    {% endif %}
  {% endfor %}

[gcode_macro K_ALIGN_PLATFORM]
gcode:
  {% set align = printer.configfile.settings.z_align %}
  {% set maximum = printer.configfile.settings.stepper_z.position_max|float %}
  {% set retract = align.rising_dist|float %}
  RESTORE_Z_LIMIT
  BED_MESH_CLEAR
  Z_ALIGN_ENDSTOPS SPEED={align.quick_speed} DISTANCE={maximum + align.safe_dist|float}
  SET_KINEMATIC_POSITION Z={maximum} SET_HOMED=Z
  G91
  G1 Z-{retract} F{align.slow_speed|float * 60.0}
  G90
  M400
  Z_ALIGN_ENDSTOPS SPEED={align.slow_speed} DISTANCE={retract * 2.0} REQUIRE_RELEASE=1

[gcode_macro K_HOME_XY]
gcode:
  {% set acceleration = printer.toolhead.max_accel|float %}
  SET_VELOCITY_LIMIT ACCEL=100
  BOX_DISABLE_HEART_PROCESS TNN=T1A
  # Clear a stall latched by an interrupted homing cycle.
  MOTOR_STALL_MODE DATA=2
  MOTOR_STALL_MODE DATA=1
  MOTOR_SYS_PARAM NUM=1 DATA=1 ID=70 PARAMS=300 PARAMS_TYPE=float
  G90
  G4 P2000
  G28 Y
  G1 Y10 F1800
  M400
  MOTOR_STALL_MODE DATA=2
  K_CHECK_MOTORS
  MOTOR_STALL_MODE DATA=1
  G4 P2000
  G28 X
  G1 X340 F1800
  G91
  G1 X-1.5 Y1.5 F420
  G90
  M400
  MOTOR_STALL_MODE DATA=2
  K_CHECK_MOTORS
  MOTOR_SYS_PARAM NUM=1 DATA=1 ID=70 PARAMS=100 PARAMS_TYPE=float
  BOX_ENABLE_HEART_PROCESS TNN=T1A
  _K_ASSERT_XY_HOME
  SET_VELOCITY_LIMIT ACCEL={acceleration}

[gcode_macro _K_ASSERT_XY_HOME]
variable_messages: {'ru': 'Проверка драйверов сбросила координаты XY; движение запрещено', 'en': 'Driver protection invalidated XY homing; movement is blocked'}
gcode:
  {% if 'xy' not in printer.toolhead.homed_axes %}
    {% set language = printer.configfile.settings.k2_print.language|default('en') %}
    {action_raise_error(messages.get(language, messages.en))}
  {% endif %}

[gcode_macro K_PROBE_APPROACH]
gcode:
  G90
  G1 Z{params.Z|default(15)|float} F480
  M400

[gcode_macro K_PROBE_CONTACT]
gcode:
  PROBE

[gcode_macro K_Z_CLEARANCE]
variable_lift: 10.0
variable_errors: {'ru': 'Невозможно безопасно отвести платформу: координата Z не подтверждена', 'en': 'Cannot clear the platform safely: Z position is not verified'}
gcode:
  {% set language = printer.configfile.settings.k2_print.language|default('en') %}
  {% set errors = printer['gcode_macro K_Z_CLEARANCE'].errors %}
  {% set position = printer.toolhead.position.z|float %}
  {% set minimum = printer.toolhead.axis_minimum.z|float %}
  {% set maximum = printer.toolhead.axis_maximum.z|float %}
  {% set bottom_max = [maximum, printer['gcode_macro K_HOME_SETTINGS'].bottom_reference|float]|max %}
  {% if 'z' not in printer.toolhead.homed_axes or not (minimum <= position <= bottom_max) %}
    {action_raise_error(errors.get(language, errors.en))}
  {% endif %}
  {% set lift = [printer['gcode_macro K_Z_CLEARANCE'].lift|float, 0.0]|max %}
  {% set distance = [lift, [maximum - position, 0.0]|max]|min %}
  SAVE_GCODE_STATE NAME=K_Z_CLEARANCE
  G91
  {% if distance > 0.0 %}
    G1 Z{distance} F120
  {% endif %}
  M400
  RESTORE_GCODE_STATE NAME=K_Z_CLEARANCE MOVE=0
