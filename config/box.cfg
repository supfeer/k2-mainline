[serial_485 serial485]
serial: /dev/ttyS5
baud: 230400

[auto_addr]

[filament_rack]
not_pin: !PA5

[box]
bus:serial485
filament_sensor:filament_sensor
pre_cut_pos_x: 10           # Pre-cut approach X coordinate
pre_cut_pos_y: 200
#cut_pos_x: -6.5    
cut_pos_y: 200
Tn_retrude: -10             # Post-cut extruder retract distance (mm)
Tn_retrude_velocity: 600    # Retract speed (mm/min)
Tn_extrude_temp: 220        # Default extrusion temperature (C)
Tn_extrude: 140             # Preheat threshold / standby temperature (C)
Tn_extrude_velocity: 360    # Extrude speed (mm/min)
buffer_empty_len: 30        # Reserve extrude length from cutter to gears (mm)
clean_left_pos_x: 135       # Purge wipe shake left X coordinate
clean_left_pos_y: 378
clean_right_pos_x: 160      # Purge wipe shake right X coordinate
clean_right_pos_y: 378
clean_velocity: 12000
box_need_clean_length:70
cut_velocity: 30000
extrude_pos_x: 133          # Purge chute X coordinate
extrude_pos_y: 378
has_extrude_pos: 1          # Enable purge chute workflow (F008=1)
safe_pos_y: 345
safe_pos_x: 225
clean_pos_left_x: 160       # Silicone wiper left X coordinate
clean_pos_right_x:170       # Silicone wiper right X coordinate
clean_pos_middle_y:374      # Silicone wiper center Y coordinate
pre_cut_cal_pos_x:-5        # Cutter calibration start X coordinate
check_cut_pos_x_max: -5.5   # Cutter calibration max X bound
check_cut_pos_x_min: -9.5   # Cutter calibration min X bound
switch_pin:!nozzle_mcu:PB9
version: 1

[load_ai]

[gcode_macro BOX_LOAD_MATERIAL_HEATING]
gcode:
  BOX_GO_TO_EXTRUDE_POS
  BOX_SET_TEMP

[gcode_macro BOX_LOAD_MATERIAL_CUT_MATERIAL]
gcode:
  BOX_CUT_MATERIAL
  BOX_SAVE_FAN

[gcode_macro BOX_LOAD_MATERIAL_RETRUDE_MATERIAL]
gcode:
  BOX_GO_TO_EXTRUDE_POS
  BOX_SET_TEMP
  BOX_MODE_WAIT
  BOX_RETRUDE_MATERIAL

[gcode_macro BOX_LOAD_MATERIAL_EXTRUDE_MATERIAL]
gcode:
  {% set get_tnn = "" %}
  {% if 'TNN' in params|upper %}
    {% set get_tnn = ('TNN=' + params.TNN) %}
  {% endif %}
  BOX_MODE_WAIT
  BOX_EXTRUDE_MATERIAL {get_tnn}

[gcode_macro BOX_LOAD_MATERIAL_MATERIAL_FLUSH]
gcode:
  {% set get_tnn = "" %}
  {% if 'TNN' in params|upper %}
    {% set get_tnn = ('TNN=' + params.TNN) %}
  {% endif %}
  BOX_EXTRUDER_EXTRUDE {get_tnn}
  BOX_MATERIAL_CHANGE_FLUSH

[gcode_macro BOX_LOAD_MATERIAL_END]
gcode:
  BOX_RESTORE_FAN
  BOX_MOVE_TO_SAFE_POS

[gcode_macro BOX_LOAD_MATERIAL]
gcode:
  BOX_LOAD_MATERIAL_HEATING
  BOX_LOAD_MATERIAL_CUT_MATERIAL
  BOX_LOAD_MATERIAL_RETRUDE_MATERIAL
  BOX_LOAD_MATERIAL_EXTRUDE_MATERIAL
  BOX_LOAD_MATERIAL_MATERIAL_FLUSH
  BOX_LOAD_MATERIAL_END

[gcode_macro BOX_QUIT_MATERIAL_HEATING]
gcode:
  BOX_GO_TO_EXTRUDE_POS
  {% if printer["filament_switch_sensor filament_sensor"].filament_detected %}
    BOX_SET_TEMP
  {% endif %}

[gcode_macro BOX_QUIT_MATERIAL_CUT_MATERIAL]
gcode:
  BOX_CUT_MATERIAL

[gcode_macro BOX_QUIT_MATERIAL_RETRUDE_MATERIAL]
gcode:
  BOX_GO_TO_EXTRUDE_POS
  {% if printer["filament_switch_sensor filament_sensor"].filament_detected %}
    BOX_SET_TEMP
  {% endif %}
  BOX_RETRUDE_MATERIAL

[gcode_macro BOX_QUIT_MATERIAL_END]
gcode:
  BOX_MOVE_TO_SAFE_POS

[gcode_macro BOX_QUIT_MATERIAL]
gcode:
  BOX_QUIT_MATERIAL_HEATING
  BOX_QUIT_MATERIAL_CUT_MATERIAL
  BOX_QUIT_MATERIAL_RETRUDE_MATERIAL
  BOX_QUIT_MATERIAL_END

# eg:
# BOX_EXTRUDE_MATERIAL TNN=T1A
# BOX_EXTRUDER_EXTRUDE TNN=T1A
# BOX_MATERIAL_FLUSH LEN=100 VELOCITY=360 TEMP=220
# BOX_RETRUDE_MATERIAL_WITH_TNN TNN=T1A

[gcode_macro BOX_INFO_REFRESH]
gcode:
  BOX_SET_PRE_LOADING ADDR={params.ADDR} NUM={params.NUM} ACTION=RUN
  M400
  BOX_GET_RFID ADDR={params.ADDR} NUM={params.NUM}
  M400
  BOX_GET_REMAIN_LEN ADDR={params.ADDR} NUM={params.NUM}
  M400

# CR_BOX_PRE_OPT
# CR_BOX_CUT
# CR_BOX_RETRUDE
# CR_BOX_EXTRUDE
# CR_BOX_WASTE
# CR_BOX_FLUSH
# CR_BOX_END_OPT
# CR_BOX_PRE_OPT_EXTRA
# CR_BOX_END_OPT_EXTRA
# Prepare change: M8200 P S[next]       -> CR_BOX_PRE_OPT
# Cut filament: M8200 C S0              -> CR_BOX_CUT
# Retract to CFS: M8200 R I[pre] p0     -> CR_BOX_RETRUDE
# Feed from CFS: M8200 L I[next] p1     -> CR_BOX_EXTRUDE
# Check chute: M8200 W                  -> CR_BOX_WASTE
# Flush purge: M8200 F S[spd]L[len]     -> CR_BOX_FLUSH
# End change: M8200 O S[next]           -> CR_BOX_END_OPT
[gcode_macro M8200]
variable_tnn: None
gcode:
  {% if params.P is defined %}
    # Prepare change: M8200 P S[next]
    CR_BOX_PRE_OPT
  {% endif %}
  {% if params.C is defined %}
    # Cut filament: M8200 C S0
    CR_BOX_CUT
  {% endif %}
  {% if params.R is defined %}
    # Retract to CFS: M8200 R I[pre] p0
    {% if params.E is defined %}
      CR_BOX_RETRUDE LENGTH={params.E|float}
    {% else %}
      CR_BOX_RETRUDE
    {% endif %}
  {% endif %}
  {% if params.L is defined %}
    # Feed from CFS: M8200 L I[next] p1
    {% set I_param = params.I|int %}
    {% set addr = (I_param / 4 + 1)|int|string %}
    {% set num_map = ['A', 'B', 'C', 'D'] %}
    {% set num = (I_param % 4)|int %}
    {% set tnn = 'T' + addr + num_map[num] %}
    {action_respond_info("tnn: %s" % tnn)}
    CR_BOX_EXTRUDE TNN={tnn}
    SET_GCODE_VARIABLE MACRO=M8200 VARIABLE=tnn VALUE='"{tnn}"'
    CR_BOX_WASTE
  {% endif %}
  {% if params.W is defined %}
    # Check chute: M8200 W
    CR_BOX_WASTE
  {% endif %}
  {% if params.F is defined %}
    # Flush purge: M8200 F S[speed]L[length]
    {% set tnn = printer['gcode_macro M8200'].tnn %}
    {action_respond_info("tnn: %s" % tnn)}
    CR_BOX_FLUSH TNN={tnn}
    SET_GCODE_VARIABLE MACRO=M8200 VARIABLE=tnn VALUE='""'
  {% endif %}
  {% if params.O is defined %}
    # End change: M8200 O S[next]
    CR_BOX_END_OPT
  {% endif %}

