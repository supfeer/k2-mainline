# K2 CS1237 configuration; do not combine with [prtouch_v3].
# Provisional scale only: 1 displayed "g" means 100 ADC counts, NOT 1 gram.
# Migration preserves the individual reference; no default zero is fabricated.
[load_cell_probe]
sensor_type: cs1237
sclk_pin: nozzle_mcu:PB13
dout_pin: nozzle_mcu:PB14
sample_rate: 1280
gain: 128
reference_output: True
drift_filter_cutoff_frequency: 0.1
drift_filter_delay: 2
# First order rejects the measured fan noise without delaying contact past RAW_RANGE.
buzz_filter_cutoff_frequency: 150
buzz_filter_delay: 1
# Nominal trigger: 4000 counts; raw fault band: reference +/-20000 counts.
# The fault band is active until the first trigger, not a calibrated force limit.
# The raw signal can peak later while the synchronized Z motors stop.
# counts_per_gram and z_offset live in printer.cfg so SAVE_CONFIG avoids include conflicts.
sensor_orientation: inverted
trigger_force: 40
force_safety_limit: 200
# Stock K2 contact speed; K2 fits the captured descent before contact relaxes.
speed: 5
# Stock quick-lift Z limit; contact fitting uses samples from the descent.
lift_speed: 30
# Clears the contact for the next fine approach; see K2 UNLOADED_MIN_Z.
sample_retract_dist: 2
samples: 1
